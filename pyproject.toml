[project]
name = "modal-compose"
version = "0.1.0"
description = "A declarative dev-box MCP library for Modal: single sandboxes built from layered images."
readme = "README.md"
authors = [
    { name = "Adam Azzam", email = "33043305+aaazzam@users.noreply.github.com" }
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.1",
    "cryptography>=43.0.0",
    "cyclopts>=4.19.0",
    "fastapi>=0.138.1",
    "fastmcp>=3.4.2",
    "modal>=1.5.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.9.0",
    "requests>=2.32.0",
    "uvicorn>=0.49.0",
]

[project.scripts]
modal-compose = "modal_compose:main"

[project.urls]
Homepage = "https://github.com/aaazzam/modal-compose"
Repository = "https://github.com/aaazzam/modal-compose"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=modal_compose",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
filterwarnings = [
    "error",
]
markers = [
    "unit: fast, isolated, no external dependencies (the default).",
    "integration: touches Modal / network / external layers.",
    "slow: noticeably slow; deselect with -m 'not slow'.",
]

[tool.coverage.run]
branch = true
source = ["modal_compose"]
omit = ["*/examples.py", "*/templates/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.pyright]
include = ["src"]
exclude = ["src/modal_compose/templates"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
